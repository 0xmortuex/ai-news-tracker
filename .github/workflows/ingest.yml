name: ingest

# Fetch sources, build news.json and publish it to the orphan `data` branch
# (one commit, force-pushed every run, so history never grows).
# Served at https://raw.githubusercontent.com/0xmortuex/ai-news-tracker/data/news.json

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20' # tests run on Node 20 and 22 in test.yml

      - name: Test
        run: npm test

      - name: Restore previous data (ETags, health, item pool)
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git archive FETCH_HEAD | tar -x -C data
            ls -la data
          else
            echo "no data branch yet: first run"
          fi

      # Exits 1 without writing anything when news.json is invalid or below the
      # sanity floor (min items / min healthy sources / >50% drop), so the step
      # below is skipped and the previous data stays published.
      # Besides news.json this writes releases.json, digest-daily.json, digest-weekly.json,
      # digest.json (copy of the daily one), digest-daily.md, digest-weekly.md, status.json and (Phase 3)
      # stories.json, entities.json, top.json and feed.rss.
      # Every file is schema-validated first; any failure refuses the whole run.
      # The weekly digest is regenerated once per UTC day (the script reuses today's file
      # on the other runs), so the 30 minute cadence does not churn it.
      - name: Ingest
        run: node scripts/ingest.mjs --out data

      # guides.json replaces the old Cloudflare Worker /guides/aggregate route. Refreshed at
      # most every 110 minutes. A failure here (rate limit, below the item floor) must not
      # block the news publish: the previous guides.json restored above stays in place.
      - name: Guides
        continue-on-error: true
        run: node scripts/guides.mjs --out data --min-age-min 110
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to orphan data branch
        run: |
          cd data
          rm -rf .git
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
